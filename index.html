    <!-- Instant ambient color hydration before first paint (0ms) -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem("pstream-ambient:last");
          var r = 16, g = 21, b = 25;
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed.r === 'number') {
              r = parsed.r; g = parsed.g; b = parsed.b;
            }
          }
          document.documentElement.style.setProperty('--ambient-r', r);
          document.documentElement.style.setProperty('--ambient-g', g);
          document.documentElement.style.setProperty('--ambient-b', b);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = 'rgb(' + Math.round(r * 0.45) + ',' + Math.round(g * 0.45) + ',' + Math.round(b * 0.45) + ')';
        } catch(e) {}
      })();
    </script>
