    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2f7a"/><stop offset=".5" stop-color="#4a52c4"/><stop offset="1" stop-color="#2a2f7a"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd59a"/><stop offset="1" stop-color="#f08a6a"/></linearGradient>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb3e1"/><stop offset=".6" stop-color="#7a5bff"/><stop offset="1" stop-color="#2d2272"/></radialGradient>
