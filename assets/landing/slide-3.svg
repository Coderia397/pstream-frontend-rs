<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-label="A person stepping out of a laptop, with a tablet and a TV">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#7a5bff" stop-opacity=".55"/><stop offset="1" stop-color="#7a5bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d2272"/><stop offset=".6" stop-color="#7c56c9"/><stop offset="1" stop-color="#f0a4c6"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f7bff"/><stop offset="1" stop-color="#1d4bbd"/></linearGradient>
  </defs>
  <ellipse cx="300" cy="350" rx="310" ry="320" fill="url(#g)"/>
  <!-- saucer -->
  <g transform="translate(70 110)"><ellipse cx="0" cy="12" rx="44" ry="11" fill="#9fb4ff"/><path d="M-20 8a20 18 0 0 1 40 0z" fill="#cfe0ff"/><path d="M-30 20l-14 40h88l-14-40z" fill="#fff" opacity=".12"/></g>
  <path d="M520 90l7 21 21 7-21 7-7 21-7-21-21-7 21-7z" fill="#fff"/>
  <!-- TV -->
  <rect x="90" y="120" width="420" height="250" rx="16" fill="url(#frame)"/>
  <rect x="106" y="136" width="388" height="218" rx="8" fill="url(#sky)"/>
  <rect x="270" y="370" width="60" height="26" fill="#1d4bbd"/><rect x="220" y="394" width="160" height="10" rx="5" fill="#1d4bbd"/>
  <ellipse cx="300" cy="655" rx="230" ry="24" fill="#000" opacity=".5"/>
  <!-- tablet -->
  <g transform="rotate(8 490 540)"><rect x="440" y="470" width="130" height="170" rx="16" fill="url(#frame)"/><rect x="452" y="482" width="106" height="146" rx="8" fill="url(#sky)"/></g>
  <!-- laptop -->
  <rect x="130" y="410" width="300" height="190" rx="14" fill="url(#frame)"/>
  <rect x="146" y="426" width="268" height="158" rx="6" fill="url(#sky)"/>
  <path d="M96 604h368l-26 34H122z" fill="#2c3a7a"/>
  <!-- person stepping out of the laptop -->
  <g transform="translate(-10 40) scale(.82)">
    <rect x="262" y="344" width="84" height="104" rx="20" fill="#7b4bd8"/>
    <rect x="290" y="336" width="64" height="112" rx="24" fill="#f5c518"/>
    <rect x="266" y="350" width="24" height="86" rx="12" fill="#e7b70f"/>
    <rect x="354" y="348" width="24" height="86" rx="12" fill="#f5c518"/>
    <circle cx="322" cy="304" r="33" fill="#f0b58a"/>
    <path d="M288 302a34 34 0 0 1 68 0q-34-20-68 0z" fill="#2b2140"/>
    <path d="M294 442h56l8 126h-30l-6-80-6 80h-30z" fill="#2b4fb8"/>
    <ellipse cx="308" cy="576" rx="22" ry="9" fill="#fff"/><ellipse cx="350" cy="582" rx="22" ry="9" fill="#fff"/>
  </g>
</svg>
