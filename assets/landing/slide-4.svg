  <ellipse cx="300" cy="640" rx="250" ry="38" fill="url(#disc)"/><ellipse cx="300" cy="640" rx="60" ry="9" fill="#1b1740"/>
  <ellipse cx="300" cy="640" rx="250" ry="38" fill="none" stroke="#ffd1f0" stroke-opacity=".5" stroke-width="3"/>
