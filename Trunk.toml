[build]
target = "index.html"

[watch]
ignore = [
    "style/output.css",
    "interop/dist",
]

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "python3 scripts/make_sitemap.py || true; sh scripts/apply_brand.sh && sh scripts/build_interop.sh && ./tailwindcss -i ./style/input.css -o ./style/output.css"]

[serve]
port = 8080
open = false

