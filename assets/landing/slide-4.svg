  <g><circle cx="215" cy="520" r="11" fill="#ff7ac6"/><circle cx="255" cy="520" r="11" fill="#5a8bff"/><circle cx="295" cy="520" r="11" fill="#f5c518"/><circle cx="335" cy="520" r="11" fill="#6ee7a6"/><circle cx="375" cy="520" r="11" fill="#ff7ac6"/></g>
