[package]
name = "pstream-frontend-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "pstream-frontend-rs"
path = "src/main.rs"

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = "0.7.0"
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8.15"
log = "0.4.34"
rust-i18n = "4.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "Window",
    "MediaError",
    "EventTarget",
    "DomRect",
    "Storage",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "CssStyleDeclaration",
    "Navigator",
    "Clipboard",
] }

[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1
panic = "abort"


[profile.dev]
opt-level = 0
debug = 0
